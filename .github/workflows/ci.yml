# Integración continua: en cada push y pull request corre lo mismo que se corre a mano antes de entregar.
# Render y Vercel despliegan desde `main`; si algo falla aquí, el cambio no debe llegar a producción.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (pruebas y migraciones)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sismora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sismora
      SECRET_KEY: clave-solo-para-integracion-continua-no-es-secreta-0123456789
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Migraciones desde cero y sin diferencias con los modelos
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: Pruebas
        run: python -m pytest -q -rs

  web:
    name: Web (lint, pruebas y compilación)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

# Uso: docker compose -f infra/docker-compose.yml --env-file .env up -d db
# NO VERIFICADO: en el equipo de desarrollo no hay Docker; se usa PostgreSQL instalado (ver PROCESO.md, Fase 0).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-sismora}
    ports:
      - "5432:5432"
    volumes:
      - sismora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sismora_pgdata:
